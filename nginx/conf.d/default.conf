upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id_final;
    proxy_set_header Host $host;

    location = /api/v1/auth/login {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://backend_upstream;
    }

    location = /api/v1/auth/register {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://backend_upstream;
    }

    location ~ ^/api/v1/payments/ {
        limit_req zone=payment_zone burst=5 nodelay;
        proxy_pass http://backend_upstream;
    }

    location /api/ {
        limit_req zone=general_zone burst=40 nodelay;
        proxy_pass http://backend_upstream;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=general_zone burst=40 nodelay;
        proxy_pass http://frontend_upstream;
    }
}
